<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-item>
    <ion-label position="floating">Usuario o Correo</ion-label>
    <ion-input [(ngModel)]="identifier"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Contraseña</ion-label>
    <ion-input [(ngModel)]="password" type="password"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="login()">Iniciar Sesión</ion-button>

  <ion-item lines="none">
    <ion-label class="ion-text-center">O bien</ion-label>
  </ion-item>


  <a href="http://localhost:1339/api/connect/google">
    <ion-button color="danger" expand="block">
      <ion-icon name="logo-google" slot="start"></ion-icon>
      Iniciar con Google
    </ion-button>
  </a>

  <ion-button 
  expand="block" 
  fill="clear" 
  (click)="goToRegistro()"
  class="ion-margin-top">

  Crear cuenta / Registrarme
</ion-button>


</ion-content>
