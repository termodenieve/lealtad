<ion-header>
  <ion-toolbar>
    <ion-title>Ver empresas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-row>
    <ion-col>
      <ion-button expand="block" color="primary" (click)="obtenerEmpresas()">
        Refrescar
      </ion-button>
    </ion-col>

    <!-- Solo mostrar botón Crear si rol es admin o empresa -->
    <ion-col *ngIf="role === 'admin' || role === 'empresa'">
      <ion-button expand="block" color="success" (click)="irCrearEmpresa()">
        Crear Empresa
      </ion-button>
    </ion-col>
  </ion-row>

  <ion-list *ngIf="!loading && empresas.length > 0; else noData">
    <ion-item *ngFor="let emp of empresas">
      <ion-label>
        <h2>{{ emp.attributes?.nombre || emp.nombre }}</h2>
        <p>Dirección: {{ emp.attributes?.direccion || emp.direccion }}</p>
        <p>Teléfono: {{ emp.attributes?.telefono || emp.telefono }}</p>
      </ion-label>

      <!-- botones según rol -->
      <ion-button slot="end" size="small" color="warning"
        *ngIf="role === 'admin' || role === 'empresa'"
        (click)="editarEmpresa(emp.documentId || emp.id)">
        Editar
      </ion-button>

      <ion-button slot="end" size="small" color="danger"
        *ngIf="role === 'admin' || role === 'empresa'"
        (click)="eliminarEmpresa(emp.documentId || emp.id)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>

  <ng-template #noData>
    <ion-text color="medium">
      <p class="ion-text-center" *ngIf="!loading">No hay empresas disponibles</p>
      <p class="ion-text-center" *ngIf="loading">Cargando...</p>
    </ion-text>
  </ng-template>
</ion-content>
