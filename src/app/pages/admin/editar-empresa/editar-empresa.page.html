<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Nombre</ion-label>
    <ion-input [(ngModel)]="nombre" placeholder="Nombre de la empresa"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Dirección</ion-label>
    <ion-input [(ngModel)]="direccion" placeholder="Dirección"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Teléfono</ion-label>
    <ion-input [(ngModel)]="telefono" placeholder="Teléfono"></ion-input>
  </ion-item>

  <ion-button expand="full" color="primary" (click)="editarEmpresa()">
    Guardar cambios
  </ion-button>
</ion-content>
