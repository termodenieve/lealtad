<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Editar Promoción</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Modificar Promoción</ion-card-title>
      <ion-card-subtitle>Edita los datos de la promoción seleccionada</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="editarPromocion()">

        <!-- Nombre -->
        <ion-item>
          <ion-label position="floating">Nombre de la promoción</ion-label>
          <ion-input
            [(ngModel)]="nombre"
            name="nombre"
            type="text"
            required
          ></ion-input>
        </ion-item>

        <!-- Descripción -->
        <ion-item>
          <ion-label position="floating">Descripción</ion-label>
          <ion-textarea
            [(ngModel)]="descripcion"
            name="descripcion"
            autoGrow="true"
            required
          ></ion-textarea>
        </ion-item>

        <!-- Visitas -->
        <ion-item>
          <ion-label position="floating">Visitas</ion-label>
          <ion-input
            [(ngModel)]="visitas"
            name="visitas"
            type="number"
          ></ion-input>
        </ion-item>

        <div class="botones">
          <ion-button expand="block" color="success" type="submit">
            Guardar cambios
          </ion-button>

          <ion-button expand="block" color="medium">
            Cancelar
          </ion-button>
        </div>

      </form>
    </ion-card-content>
  </ion-card>

</ion-content>
